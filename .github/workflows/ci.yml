name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: session_bridge
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: session_bridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U session_bridge" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://session_bridge:ci_only_password@localhost:5432/session_bridge_test
      DATABASE_URL_TEST: postgresql://session_bridge:ci_only_password@localhost:5432/session_bridge_test
      TOKEN_PEPPER: ci-only-pepper-ci-only-pepper-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install # switch to `npm ci` once package-lock.json is committed
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
